<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us | QuboolHain Matrimonial</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Website Header -->
    <header>
      <div class="nav-wrap">
        <!-- Website Logo -->
        <a href="index.html" class="logo">
          <img
            src="images/logo.png"
            alt="QuboolHain"
            style="height: 100px; width: auto"
          />
        </a>
        <!-- Mobile Navigation Toggle -->
        <button class="nav-toggle" aria-label="Toggle navigation menu">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <!-- Main Navigation Menu-->
        <nav>
          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="services.html">Membership</a></li>
            <li><a href="register.html" aria-current="page">Register</a></li>
            <li><a href="contact.html">Contact</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <!--Hero Section-->
    <section class="hero" style="padding: 60px 24px">
      <h1>Get in touch</h1>
      <p>
        Questions about membership or the matchmaking process? we are happy to
        help.
      </p>
    </section>

    <section class="section container">
      <h2 class="section-title">Send us a message</h2>
      <form action="#" method="post" onsubmit="return false;">
        <div class="form-row">
          <div class="form-group">
            <label for="customer-name">Your name</label>
            <input
              type="text"
              id="customer-name"
              name="customer-name"
              required
            />
          </div>
          <div class="form-group">
            <label for="customer-email">Your Email</label>
            <input
              type="email"
              id="customer-email"
              name="customer-email"
              required
            />
          </div>
          <div class="form-row">
            <div class="form-group full">
              <label for="customer-message">Message *</label>
              <textarea
                id="customer-message"
                name="customer-message"
                rows="6"
                required
              >
              </textarea>
            </div>
          </div>
        </div>
        <button type="submit" class="btn" style="width: 100%">
          Send message
        </button>
      </form>
    </section>
    <!-- website footer-->
    <footer>
      <!--Our company social links-->
      <div class="social-links">
        <a
          href="https://www.facebook.com/Quboolhain"
          target="_blank"
          aria-label="Visit out Facebook Page"
          >Facebook</a
        >
        <a
          href="https://www.facebook.com/groups/quboolhain"
          target="_blank"
          aria-label="Visit out Facebook Group"
          >Facebook Group</a
        >
        <a
          href="https://www.instagram.com/quboolhain_matrimonial/"
          target="_blank"
          aria-label="Visit out Instagram Page"
          >Instagram</a
        >
      </div>
      <p>
        &copy; <span id="copyright-year">2026</span> QuboolHain Matrimonial. All
        rights reserved.
      </p>
    </footer>
    <!--External JavaScript-->
    <script src="js/script.js"></script>
  </body>
</html>
